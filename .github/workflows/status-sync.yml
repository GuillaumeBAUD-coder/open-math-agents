# Daily: refresh the erdosproblems.com status of the Erdős problems in the catalogue (scripts/sync_erdos_status.py).
# An open problem whose main Erdős problem is now proved, disproved or solved upstream becomes a known result at the next
# build (scripts/build_data.mjs), unless it was proved here. Trusted: runs only on main, never on pull request code.
name: status-sync
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: status-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - name: Refresh the Erdős statuses
        run: python3 -I scripts/sync_erdos_status.py
      - name: Commit if anything changed
        run: |
          git diff --quiet -- data/catalog.json && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -q -m "Catalogue: Erdős problem statuses from erdosproblems.com"
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
