# Trusted stage. Never checks out or runs PR code.
name: verdict
on:
  workflow_run:
    workflows: [check-proof]
    types: [completed]
  pull_request_target:
    types: [closed]
    paths: ["proofs/**", "reductions/**", "statements/**"]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write  # to re-run a check that failed on our side (fault)
  id-token: write  # an OIDC token proves to the site that a credit request comes from this workflow
jobs:
  report:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verdict
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Re-check the diff from the API, comment, merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OMA_SITE: ${{ vars.OMA_SITE }}
        run: |
          set -euo pipefail
          PR=$(head -c 12 artifact/pr.txt | tr -cd '0-9')
          [ -n "$PR" ] || exit 0
          gh api "repos/$REPO/pulls/$PR" > pr.json
          gh api "repos/$REPO/pulls/$PR/files" > files.json
          python3 -I - <<'PY' > decision.txt
          import json, os, re
          pr = json.load(open("pr.json")); files = json.load(open("files.json")); v = json.load(open("artifact/verdict.json"))
          cat = {p["id"]: p for p in json.load(open("base/data/catalog.json"))["problems"]}
          verdict, reason = v.get("verdict", "fault"), v.get("reason", "")
          m = re.fullmatch(r"(proofs|reductions|statements)/([A-Za-z0-9_.'\-]+)\.lean", files[0]["filename"]) if len(files) == 1 and files[0]["status"] == "added" else None
          path = files[0]["filename"] if m else ""
          pid = m.group(2) if m else None
          if pr["head"]["sha"] != os.environ["HEAD_SHA"]:
              verdict, reason = "stale", "the pull request changed after this check; a newer check will report"
          elif not m or v.get("problem") not in (None, pid):
              verdict, reason = "rejected", "a pull request must add exactly one file proofs/<id>.lean, reductions/<id>.R<n>.lean or statements/<id>.lean"
          print(verdict); print(path); print(v.get("kind", "")); print(v.get("polarity", "proof")); print(reason.replace("\n", " ")[:900])
          PY
          mapfile -t D < decision.txt
          VERDICT="${D[0]}"; FPATH="${D[1]}"; KIND="${D[2]}"; POL="${D[3]}"; REASON="${D[4]}"
          [ "$VERDICT" = "stale" ] && exit 0
          PID="$(basename "$FPATH" .lean)"
          # Defence in depth: re-run the linter from main (trusted code) on the exact file at the checked commit.
          # Its verdict on kind and polarity replaces whatever the untrusted artifact claimed.
          if [ "$VERDICT" = "accepted" ]; then
            mkdir -p "base/$(dirname "$FPATH")"
            gh api "repos/$REPO/contents/$FPATH?ref=$HEAD_SHA" --jq .content | base64 -d > "base/$FPATH"
            if ! (cd base && python3 -I tools/lint.py "$FPATH" data/catalog.json > /tmp/relint.json); then
              VERDICT=rejected; REASON="lint (trusted re-check): $(python3 -I -c 'import json;print("; ".join(json.load(open("/tmp/relint.json"))["errors"]))')"
            else
              POL=$(python3 -I -c 'import json;print(json.load(open("/tmp/relint.json"))["polarity"])')
              KIND=$(python3 -I -c 'import json;d=json.load(open("/tmp/relint.json"));print(d["type"] if d["type"] in ("reduction","statement") else d["kind"])')
            fi
          fi
          case "$VERDICT" in
            accepted)
              if [ "$KIND" = "statement" ]; then
                gh label create needs-human-review --repo "$REPO" --color E8C547 2>/dev/null || true
                gh pr edit "$PR" --repo "$REPO" --add-label needs-human-review || true
                gh pr comment "$PR" --repo "$REPO" --body "**The statement compiles.** A maintainer now checks that it says exactly what the problem says (same quantifiers, same ranges, nothing simplified) before merging. Once merged, \`$PID\` becomes provable by everyone, and the formalization is credited to you. Label: needs-human-review. [Run]($RUN_URL)"
              elif [ "$KIND" = "open" ]; then
                MSG="**ACCEPTED by the Lean checker** ($POL of \`$PID\`). This is an open problem: before it is marked solved, a maintainer checks that the formal statement really says what the problem says (a mistranslated statement is the usual reason an 'open problem' falls easily). Label: needs-human-review. [Run]($RUN_URL)"
                gh label create needs-human-review --repo "$REPO" --color E8C547 2>/dev/null || true
                gh pr edit "$PR" --repo "$REPO" --add-label needs-human-review || true
                gh pr comment "$PR" --repo "$REPO" --body "$MSG"
              else
                gh pr comment "$PR" --repo "$REPO" --body "**ACCEPTED** ($POL of \`$PID\`): $REASON. Merging. [Run]($RUN_URL)"
                if gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"; then
                  # A merge made with GITHUB_TOKEN triggers no other workflow, so credit it here.
                  bash base/tools/credit.sh "$PR" || true
                else
                  gh pr comment "$PR" --repo "$REPO" --body "Could not merge automatically (probably already proved by someone else first)."
                fi
              fi ;;
            rejected) gh pr comment "$PR" --repo "$REPO" --body "**REJECTED**: $REASON. Push a fixed file to this pull request, or move on. [Run]($RUN_URL)" ;;
            *)
              # A fault is ours (a download that failed, a runner problem): re-run the same check, up to 3 attempts.
              if [ "${RUN_ATTEMPT:-1}" -lt 3 ] && gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun" >/dev/null; then
                gh pr comment "$PR" --repo "$REPO" --body "**FAULT** (our side, not your proof): $REASON. Re-running the check automatically (attempt $((RUN_ATTEMPT + 1)) of 3). [Run]($RUN_URL)"
              else
                gh pr comment "$PR" --repo "$REPO" --body "**FAULT** (our side, not your proof): $REASON. Three attempts failed; a maintainer has been notified. Pushing any new commit also re-runs the check. [Run]($RUN_URL)"
              fi ;;
          esac
  credit:
    # A merged proof is the canonical acceptance: tell the site.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
          sparse-checkout: tools/credit.sh
          sparse-checkout-cone-mode: false
      - name: Report to the desk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OMA_SITE: ${{ vars.OMA_SITE }}
          PR: ${{ github.event.pull_request.number }}
        run: bash base/tools/credit.sh "$PR"
