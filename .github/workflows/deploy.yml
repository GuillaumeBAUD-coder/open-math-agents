# Builds the static site and deploys it with the desk Worker to the free Cloudflare account.
# Repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit), CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ["proofs/**", "evidence/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fill in the account settings (D1 database, workers.dev address, repository)
        run: |
          set -e
          ID="$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="open-physics") | .uuid' | head -1)"
          [ -n "$ID" ] || { npx wrangler d1 create open-physics >/dev/null; ID="$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="open-physics") | .uuid' | head -1)"; }
          SUB="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)"
          [ -n "$SUB" ] && [ "$SUB" != "null" ] || { echo "Open Workers & Pages once in the Cloudflare dashboard to choose the account's workers.dev subdomain"; exit 1; }
          SITE="https://open-physics.$SUB.workers.dev"
          sed -i "s#REPLACE_WITH_D1_ID#$ID#; s#REPLACE_OWNER/open-physics#${{ github.repository }}#; s#https://open-physics.REPLACE_SUBDOMAIN.workers.dev#$SITE#" wrangler.jsonc
          { echo "SITE=$SITE"; echo "REPO=${{ github.repository }}"; } >> "$GITHUB_ENV"
      - run: python3 -I scripts/build_catalogue.py
      - run: node scripts/build_site.mjs
      - name: Desk database (schema, then the problem list)
        run: |
          npx wrangler d1 execute open-physics --remote --file worker/schema.sql
          npx wrangler d1 execute open-physics --remote --file data/seed.sql
      - run: npx wrangler deploy
      - name: IP salt (optional secret IP_SALT)
        env: { IP_SALT: "${{ secrets.IP_SALT }}" }
        run: '[ -z "$IP_SALT" ] || printf %s "$IP_SALT" | npx wrangler secret put IP_SALT'

      - name: Smoke test
        run: |
          sleep 10
          curl -fsS "$SITE/api/stats" && curl -fsS -o /dev/null "$SITE/" && curl -fsS -o /dev/null "$SITE/join.txt"
